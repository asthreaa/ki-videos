<!DOCTYPE html>
<html lang="de">
<head>

<body>
<div id="stage">
  <canvas id="webgl-canvas" width="1080" height="1920"></canvas>

  <!-- Top Header Bar -->
  <div id="top-header">
    <div class="hdr-logo">
      <svg width="60" height="60" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="28" fill="#cbd5e1" stroke="#0f172a" stroke-width="4"/>
        <circle cx="22" cy="24" r="6" fill="#94a3b8"/>
        <circle cx="40" cy="38" r="8" fill="#94a3b8"/>
        <circle cx="26" cy="44" r="4" fill="#94a3b8"/>
      </svg>
    </div>
    <div class="hdr-col">
      <div class="hdr-title">DAS MOND-PROJEKT</div>
      <div class="hdr-badges">
        <div class="badge-red">TAG 1</div>
        <div id="hdr-counter" class="badge-blue">🧑‍🚀 1 Bewohner · 0,5% sauber</div>
      </div>
    </div>
  </div>

  <!-- Giant Intro "TAG 1" -->
  <div id="intro-tag">TAG 1</div>

  <!-- Center Dynamic Cards -->
  <div id="center-cards"></div>

  <!-- Bottom Impact Word + Pill Banner -->
  <div id="bottom-zone">
    <div id="impact-word"></div>
    <div id="pill-sub" style="display:none"></div>
  </div>
</div>

<script src="./three.min.js"></script>
<script>
window.TIMELINE = null;
window.WORDS = [];

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * clamp(t, 0, 1); }
function easeOutBack(x) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

// ---------- THREE.JS REAL SANDY-GRAINED LUNAR WORLD (NO Stadium Rings, NO Campfire!) ----------
const canvas = document.getElementById('webgl-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1080, 1920, false);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

// Deep Starry Space Sky + Distant Blue Earth for Close-Up View
const skyCan = document.createElement('canvas');
skyCan.width = 1024; skyCan.height = 1024;
const sCtx = skyCan.getContext('2d');
const sGrad = sCtx.createLinearGradient(0, 0, 0, 1024);
sGrad.addColorStop(0.0, '#050811');
sGrad.addColorStop(0.35, '#0f172a');
sGrad.addColorStop(0.65, '#334155');
sGrad.addColorStop(1.0, '#64748b');
sCtx.fillStyle = sGrad;
sCtx.fillRect(0, 0, 1024, 1024);

let stSeed = 777;
function sRand() { stSeed = (stSeed * 16807) % 2147483647; return (stSeed - 1) / 2147483646; }
for (let i = 0; i < 220; i++) {
  const x = sRand() * 1024;
  const y = sRand() * 520;
  const r = 0.8 + sRand() * 2.0;
  sCtx.fillStyle = `rgba(255,255,255,${0.35 + sRand() * 0.65})`;
  sCtx.beginPath();
  sCtx.arc(x, y, r, 0, Math.PI * 2);
  sCtx.fill();
}
scene.background = new THREE.CanvasTexture(skyCan);

const camera = new THREE.PerspectiveCamera(38, 1080 / 1920, 0.5, 300);

const hemiLight = new THREE.HemisphereLight(0xf1f5f9, 0x334155, 0.72);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 0.92);
sunLight.position.set(32, 48, 22);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.left = -45;
sunLight.shadow.camera.right = 45;
sunLight.shadow.camera.top = 45;
sunLight.shadow.camera.bottom = -45;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

function makeMat(color, roughness = 0.82, metalness = 0.08) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

function addOutline(mesh, color = 0x1e293b, threshold = 26) {
  const edges = new THREE.EdgesGeometry(mesh.geometry, threshold);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color }));
  mesh.add(line);
  return mesh;
}

// ---------- 1. SMOOTH, SANDY-GRAINED MOON SURFACE ("Kleine Körner sandmäßig & großflächig verteilt") ----------
// Widely spaced, gentle craters ("großflächig verteilt" — only 9 wide, soft craters across the whole area!)
const craters = [
  { x: -13.5, z: -10.5, r: 4.2, d: 0.75 },
  { x: 14.0,  z: -9.5,  r: 4.8, d: 0.85 },
  { x: -15.0, z: 9.0,   r: 3.9, d: 0.70 },
  { x: 13.5,  z: 11.5,  r: 4.4, d: 0.80 },
  { x: 0.0,   z: 17.5,  r: 5.0, d: 0.90 },
  { x: -3.5,  z: -20.0, r: 5.2, d: 0.90 },
  { x: -24.0, z: -2.0,  r: 5.5, d: 0.95 },
  { x: 24.0,  z: 1.0,   r: 5.2, d: 0.90 },
  { x: 11.0,  z: -24.0, r: 4.6, d: 0.80 }
];

function getSmoothMoonHeight(x, z) {
  const distCenter = Math.hypot(x, z);
  const flatBase = clamp((distCenter - 6.5) / 4.5, 0, 1);

  // Very gentle, large-scale lunar dunes (smooth, NOT jagged!)
  let h = (Math.sin(x * 0.07) * Math.cos(z * 0.07) * 0.45 + Math.sin((x + z) * 0.04) * 0.3) * flatBase;

  for (let i = 0; i < craters.length; i++) {
    const c = craters[i];
    const dist = Math.hypot(x - c.x, z - c.z);
    const u = dist / c.r;
    if (u < 1.35) {
      if (u < 0.85) {
        const bowl = 0.5 * (1 + Math.cos((u / 0.85) * Math.PI));
        h -= c.d * bowl;
      } else {
        const rimU = (u - 0.85) / 0.50;
        h += c.d * 0.25 * Math.sin(rimU * Math.PI);
      }
    }
  }
  return h;
}

// Fine Sand-Grain Moon Texture (2048x2048 with realistic fine lunar sand grains!)
const sandBaseCan = document.createElement('canvas');
sandBaseCan.width = 2048;
sandBaseCan.height = 2048;
const sbCtx = sandBaseCan.getContext('2d');

// Classic natural Moon grey-silver base color (with a subtle darker uncleaned dust tone)
sbCtx.fillStyle = '#7c828d';
sbCtx.fillRect(0, 0, 2048, 2048);

// Soft, large-scale subtle dust clouds ("großflächig verteilt")
for (let i = 0; i < 65; i++) {
  const x = sRand() * 2048;
  const y = sRand() * 2048;
  const r = 70 + sRand() * 160;
  const g = sbCtx.createRadialGradient(x, y, 10, x, y, r);
  const shade = sRand() > 0.5 ? 'rgba(96, 102, 114, 0.32)' : 'rgba(142, 149, 162, 0.28)';
  g.addColorStop(0, shade);
  g.addColorStop(1, 'rgba(124, 130, 141, 0)');
  sbCtx.fillStyle = g;
  sbCtx.beginPath();
  sbCtx.arc(x, y, r, 0, Math.PI * 2);
  sbCtx.fill();
}

// Fine sand grains ("so kleine Körner sandmäßig" — 65,000 tiny 1-2px sand speckles!)
const imgData = sbCtx.getImageData(0, 0, 2048, 2048);
const data = imgData.data;
for (let i = 0; i < data.length; i += 4) {
  // Subtle per-pixel sand grain noise (-14 to +14)
  const grain = ((sRand() - 0.5) * 26) | 0;
  data[i]     = clamp(data[i] + grain, 0, 255);
  data[i + 1] = clamp(data[i + 1] + grain, 0, 255);
  data[i + 2] = clamp(data[i + 2] + grain + 2, 0, 255);
}
sbCtx.putImageData(imgData, 0, 0);

// Live terrain texture that shows the cleaned light-grey sandy zone around our capsule
const liveTexCan = document.createElement('canvas');
liveTexCan.width = 2048;
liveTexCan.height = 2048;
const ltCtx = liveTexCan.getContext('2d');

const TERRAIN_SIZE = 160;
const CleanCenter = { x: -0.3, z: 2.8 };
const terrainTex = new THREE.CanvasTexture(liveTexCan);
terrainTex.anisotropy = 4;

function updateSandyMoonTexture(cleanProg) {
  ltCtx.drawImage(sandBaseCan, 0, 0);
  if (cleanProg > 0.01) {
    const cx = ((CleanCenter.x + TERRAIN_SIZE / 2) / TERRAIN_SIZE) * 2048;
    const cy = ((CleanCenter.z + TERRAIN_SIZE / 2) / TERRAIN_SIZE) * 2048;
    const maxR = (5.4 / TERRAIN_SIZE) * 2048;
    const r = maxR * (0.25 + 0.75 * cleanProg);

    const grad = ltCtx.createRadialGradient(cx, cy, r * 0.65, cx, cy, r);
    grad.addColorStop(0.0, 'rgba(222, 228, 236, 0.88)'); // Clean, bright light-silver Moon sand
    grad.addColorStop(0.8, 'rgba(210, 217, 226, 0.75)');
    grad.addColorStop(1.0, 'rgba(210, 217, 226, 0.0)');
    ltCtx.fillStyle = grad;
    ltCtx.beginPath();
    ltCtx.arc(cx, cy, r, 0, Math.PI * 2);
    ltCtx.fill();
  }
  terrainTex.needsUpdate = true;
}

// ---------- FRAME UPDATE ----------
window.setTime = function(t) {
  if (!window.TIMELINE) return;
  const M = window.TIMELINE.markers;

  const isIntro = t < M.t_overview - 0.15;
  const isOutro = t >= M.t_outro - 0.25;

  // Sweep progress across the video
  const cleanProg = clamp((t - 4.0) / 22.0, 0.15, 1.0);
  updateSandyMoonTexture(cleanProg);
  sweepableDustPiles.forEach((sp) => {
    sp.mesh.visible = cleanProg < sp.threshold;
  });

  roofDishGroup.rotation.y = Math.sin(t * 0.7) * 0.45;

  // 1. CAMERA & SMOOTH ASTRONAUT ANIMATION
  if (isIntro || isOutro) {
    // Close-Up View: Astronaut stands in front of his Lunar Capsule & Lander on the sandy Moon!
    const ax = -0.3, az = 4.2;
    astroGroup.position.set(ax, getSmoothMoonHeight(ax, az), az);
    astroGroup.rotation.y = 0.08;
    broomGroup.visible = false;

    // Gentle, natural breathing & head nod
    headGroup.rotation.y = Math.sin(t * 2.0) * 0.05;
    headGroup.rotation.z = Math.cos(t * 1.6) * 0.025;
    armRig.rotation.x = Math.sin(t * 2.4) * 0.04;

    if (isOutro) {
      eyeGroups.forEach((e) => e.scale.set(1.0, 0.34, 1.0));
      mouthGroup.scale.set(1.1, 0.55, 1.0);
    } else {
      const blink = (t % 3.2 > 3.05) ? 0.15 : 1.0;
      eyeGroups.forEach((e) => e.scale.set(1.0, blink, 1.0));
      const speaking = window.WORDS.some((w) => t >= w.start && t <= w.end);
      const openAmt = speaking ? (0.55 + 0.65 * Math.abs(Math.sin(t * 25))) : 0.22;
      mouthGroup.scale.set(1.0, openAmt, 1.0);
    }

    camera.position.set(-0.15, 2.25, 10.6);
    camera.lookAt(0.1, 1.95, 2.0);
  } else {
    // Overview: Smooth 3D Isometric / Bird's-Eye Camera over the Sandy Moon Base!
    broomGroup.visible = true;
    eyeGroups.forEach((e) => e.scale.set(1.0, 1.0, 1.0));
    mouthGroup.scale.set(1.0, 0.3, 1.0);

    // Smooth, gentle arc movement of the Astronaut sweeping in front of the airlock (NO jerky twitching!)
    const sweepAngle = Math.sin(t * 0.65) * 1.1;
    const ax = CleanCenter.x + Math.sin(sweepAngle) * 2.2;
    const az = CleanCenter.z + Math.cos(sweepAngle) * 1.2;
    astroGroup.position.set(ax, getSmoothMoonHeight(ax, az), az);
    astroGroup.rotation.y = sweepAngle * 0.5;
    armRig.rotation.x = Math.sin(t * 6.0) * 0.18;

    if (t < M.t_mystery - 0.2) {
      // Smooth camera zoom out showing the Lunar Capsule, Lander, cleaned sandy zone, and wide cratered Moon
      const p = clamp((t - M.t_overview) / 3.0, 0, 1);
      const easeP = 1 - Math.pow(1 - p, 2.5);
      const camX = lerp(4.0, 14.0, easeP) + Math.sin(t * 0.25) * 1.5;
      const camY = lerp(12.0, 24.0, easeP);
      const camZ = lerp(14.0, 22.0, easeP);
      camera.position.set(camX, camY, camZ);
      camera.lookAt(0.5, 0.5, 1.0);
    } else {
      // Smooth camera flight North to the half-buried Sektor 7 Bunker Hatch!
      const p = clamp((t - (M.t_mystery - 0.2)) / 2.2, 0, 1);
      const easeP = 1 - Math.pow(1 - p, 2.5);
      const lookZ = lerp(1.0, -24.0, easeP);
      camera.position.set(lerp(14.0, 6.0, easeP), lerp(24.0, 15.0, easeP), lookZ + 14.0);
      camera.lookAt(0, 0, lookZ);
    }
  }

  renderer.render(scene, camera);

  // ---------- 2. TOP HEADER & INTRO TAG ----------
  const introTag = document.getElementById('intro-tag');
  const topHeader = document.getElementById('top-header');

  if (t < 1.8) {
    introTag.style.opacity = '1';
    topHeader.style.opacity = '0';
  } else {
    introTag.style.opacity = '0';
    topHeader.style.opacity = '1';
  }

  // ---------- 3. CENTER DYNAMIC POP-UP CARDS ----------
  const cardsEl = document.getElementById('center-cards');

  if (t >= M.t_stages - 0.3 && t < M.t_terminal - 0.4) {
    const elapsed = t - (M.t_stages - 0.1);
    const visibleCount = clamp(Math.floor(elapsed / 0.28) + 1, 1, 12);
    const tilesHtml = STAGES_DATA.map((st, idx) => {
      const show = idx < visibleCount;
      const op = show ? '1' : '0';
      const sc = show ? 'scale(1)' : 'scale(0.5)';
      return `
        <div class="stage-item" style="opacity:${op}; transform:${sc}">
          <div class="stage-box ${st.hi ? 'highlight' : ''}">
            <div class="stage-num ${st.gold ? 'gold' : ''}">${st.n}</div>
            <span>${st.icon}</span>
          </div>
          <div class="stage-label">${st.name}</div>
        </div>
      `;
    }).join('');

    cardsEl.innerHTML = `
      <div class="white-card">
        <div class="card-heading">🚀 12 STUFEN · VOM SCHRUBBER<br/>BIS ZUR MOND-KRONE</div>
        <div class="stages-grid">${tilesHtml}</div>
      </div>
    `;
  } else if (t >= M.t_terminal - 0.2 && t < M.t_ausweis - 0.4) {
    const dt = t - M.t_terminal;
    const item1 = dt > 0.8;
    const item2 = dt > 2.2;
    const item3 = t >= M.t_punkt - 0.5;
    const cashVal = t < M.t_budget - 0.5
      ? 0
      : Math.round(lerp(0, 500, clamp((t - (M.t_budget - 0.5)) / 1.2, 0, 1)));

    cardsEl.innerHTML = `
      <div class="white-card">
        <div class="card-heading">📱 AB JETZT HIER IN DEN VIDEOS</div>
        <div class="upgrade-row">
          <div class="upgrade-preview">
            <div style="font-size:145px">🛸</div>
            <div class="preview-tag">Stufe 1 · Starter-Kapsel</div>
          </div>
          <div class="upgrade-right">
            <div class="feed-list">
              ${item1 ? `<div class="feed-pill"><span>🧹 Sektor 1 gefegt</span><span class="feed-plus">+250 €</span></div>` : ''}
              ${item2 ? `<div class="feed-pill"><span>🏧 Mondstaub verkauft</span><span class="feed-plus">+250 €</span></div>` : ''}
              ${item3 ? `<div class="feed-pill"><span>💬 Kommentar</span><span class="feed-plus">+1 Punkt</span></div>` : ''}
            </div>
            <div class="counter-block">
              <div class="counter-lbl">MONDKASSE</div>
              <div class="counter-val">${cashVal} €</div>
            </div>
          </div>
        </div>
      </div>
    `;
  } else if (t >= M.t_ausweis - 0.2 && t < M.t_vote - 0.4) {
    cardsEl.innerHTML = `
      <div class="ausweis-card">
        <div class="ausweis-top">
          <span style="color:#dc2626">MOND-AUSWEIS</span>
          <span style="color:#475569">DAS MOND-PROJEKT</span>
        </div>
        <div class="ausweis-body">
          <div class="ausweis-avatar">🧑‍🚀</div>
          <div class="ausweis-info">
            <div class="ausweis-user">@dein_username</div>
            <div class="ausweis-sub">Kapsel Nr. <b>1</b> · Gründerkrater</div>
            <div class="ausweis-role">Aufgabe: 🛡️ <b>Mond-Pionier</b></div>
          </div>
        </div>
      </div>
    `;
  } else if (t >= M.t_vote - 0.2 && t < M.t_mystery - 0.3) {
    const opA = t >= M.t_opt_a - 0.6 ? 1 : 0.45;
    const opB = t >= M.t_opt_b - 0.6 ? 1 : 0.45;
    const opC = t >= M.t_opt_c - 0.6 ? 1 : 0.45;
    cardsEl.innerHTML = `
      <div class="vote-pill-hdr">🗳️ ABSTIMMUNG #1 · WAS BAUEN WIR?</div>
      <div class="vote-stack">
        <div class="vote-row-card" style="opacity:${opA}">
          <div class="vote-circle" style="background:#ef4444">A</div>
          <div class="vote-thumb">🧹</div>
          <div class="vote-text-col">
            <div class="vote-row-title">Power-Sauger-Lager</div>
            <div class="vote-row-desc">10x schneller Staub fegen · 300 €</div>
          </div>
        </div>
        <div class="vote-row-card" style="opacity:${opB}">
          <div class="vote-circle" style="background:#3b82f6">B</div>
          <div class="vote-thumb">🏭</div>
          <div class="vote-text-col">
            <div class="vote-row-title">Staub-Raffinerie</div>
            <div class="vote-row-desc">Doppeltes Geld beim Verkauf · 500 €</div>
          </div>
        </div>
        <div class="vote-row-card" style="opacity:${opC}">
          <div class="vote-circle" style="background:#eab308">C</div>
          <div class="vote-thumb">🥙</div>
          <div class="vote-text-col">
            <div class="vote-row-title">Mond-Dönerladen</div>
            <div class="vote-row-desc">Döner & Energie für alle · 400 €</div>
          </div>
        </div>
      </div>
    `;
  } else if (t >= M.t_mystery - 0.2 && t < M.t_outro - 0.25) {
    const showCard = t >= M.t_sektor7 - 1.2;
    cardsEl.innerHTML = `
      <div class="chronik-box">
        <div class="chronik-top">
          <div class="chronik-title">📜 DIE CHRONIK</div>
          <div class="chronik-badge">TEIL 1</div>
        </div>
        <div class="chronik-sub">Unter dem Mondstaub freigelegt...</div>
      </div>
      ${showCard ? `
      <div class="keycard-secret">
        <div class="keycard-hdr">
          <span>☣️</span>
          <span>SEKTOR 7 · LABOR NORD</span>
        </div>
        <div class="keycard-body">
          <div class="keycard-photo">?</div>
          <div class="keycard-lines">
            <div class="kc-lbl">NAME</div>
            <div class="kc-redact" style="width:82%"></div>
            <div class="kc-lbl">ABTEILUNG</div>
            <div class="kc-redact" style="width:60%"></div>
            <div class="kc-barcode"></div>
          </div>
        </div>
        <div class="kc-stamp">ZUTRITT NUR FÜR<br/>PERSONAL</div>
      </div>` : ''}
    `;
  } else {
    cardsEl.innerHTML = '';
  }

  // ---------- 4. GIANT 1-2 WORD IMPACT CAPTIONS & COLORED PILL BANNER (100% Frame-Synced to ElevenLabs Alignment!) ----------
  const impactEl = document.getElementById('impact-word');
  const pillEl = document.getElementById('pill-sub');

  let curWordObj = null;
  for (let i = 0; i < window.WORDS.length; i++) {
    const w = window.WORDS[i];
    const nextStart = (i + 1 < window.WORDS.length) ? window.WORDS[i + 1].start : (w.end + 0.35);
    const effectiveEnd = Math.min(w.end + 0.22, nextStart);
    if (t >= w.start && t < effectiveEnd) {
      curWordObj = w;
      break;
    }
  }

  if (curWordObj) {
    const cleanW = curWordObj.word.toUpperCase();
    impactEl.textContent = cleanW;
    impactEl.style.fontSize = cleanW.length > 12 ? '72px' : '94px';
    const popAge = clamp((t - curWordObj.start) / 0.08, 0, 1);
    const popScale = 1.0 + 0.09 * (1.0 - popAge);
    impactEl.style.transform = `scale(${popScale.toFixed(3)})`;

    if (/MOND|STUFEN|FÜNFHUNDERT|EURO|KOMMENTARE|TEIL|ZWEI|A:|B:|C:/.test(cleanW)) {
      impactEl.style.color = '#fde047';
    } else if (/VERDRECKTEN|STAUB|GESPERRTEN|SEKTOR|PERSONAL|ALLEIN/.test(cleanW)) {
      impactEl.style.color = '#f87171';
    } else if (/SAUBER|KAPSEL|FOLLOWER|DÖNERLADEN|RAFFINERIE/.test(cleanW)) {
      impactEl.style.color = '#34d399';
    } else {
      impactEl.style.color = '#ffffff';
    }
  } else if (isOutro && t > M.t_outro + 1.1) {
    impactEl.textContent = 'TEIL 2 FOLGT...';
    impactEl.style.color = '#fde047';
    impactEl.style.fontSize = '82px';
    impactEl.style.transform = 'scale(1)';
  } else {
    impactEl.textContent = '';
  }

  if (t >= 1.8 && t < M.t_overview) {
    pillEl.style.display = 'flex';
    pillEl.style.background = '#0ea5e9';
    pillEl.innerHTML = '🚀 WILLKOMMEN AUF DEM MOND';
  } else if (t >= M.t_overview && t < M.t_stages - 0.3) {
    pillEl.style.display = 'flex';
    pillEl.style.background = '#22c55e';
    pillEl.innerHTML = '🛸 AB TEIL 2: 1 FOLLOW = 1 EIGENE KAPSEL & MITFEGEN';
  } else if (t >= M.t_punkt - 0.6 && t < M.t_ausweis - 0.3) {
    pillEl.style.display = 'flex';
    pillEl.style.background = '#22c55e';
    pillEl.innerHTML = '💬 1 KOMMENTAR = +1 KAPSEL-PUNKT';
  } else if (t >= M.t_ausweis && t < M.t_vote - 0.3) {
    pillEl.style.display = 'flex';
    pillEl.style.background = '#f59e0b';
    pillEl.innerHTML = '🪪 BERUFSWUNSCH IN DIE KOMMENTARE';
  } else if (t >= M.t_vote && t < M.t_mystery - 0.3) {
    pillEl.style.display = 'flex';
    pillEl.style.background = '#3b82f6';
    pillEl.innerHTML = '🗳️ SCHREIB A, B ODER C IN DIE KOMMENTARE';
  } else {
    pillEl.style.display = 'none';
  }
};
</script>
</body>
</html>
